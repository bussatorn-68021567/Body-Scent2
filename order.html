<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="brand">Body Scent</a>
    <nav class="site-nav">
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">สินค้า</a>
    </nav>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="section-head">
          <h1>สั่งซื้อสินค้า</h1>
          <span class="rule"></span>
        </div>

        <form id="orderForm" class="form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn-solid">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p style="margin-inline:auto">&copy; Body Scent</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
